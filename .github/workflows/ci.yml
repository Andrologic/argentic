name: Argentic CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to test
        type: choice
        default: Linux ARM64
        options: [Linux ARM64, Windows x64, macOS ARM64, all]
      suite:
        description: Test suite to run
        type: choice
        default: reader
        options: [reader, full]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  advisories:
    name: Audit Cargo lockfiles
    if: inputs.suite != 'reader'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit each crate
        run: |
          status=0
          for lockfile in crates/*/Cargo.lock; do
            cargo audit --deny unsound --file "$lockfile" || status=1
          done
          exit "$status"

  cargo:
    name: Cargo (${{ matrix.platform }})
    runs-on: >-
      ${{ matrix.platform == 'Linux ARM64' && 'ubuntu-24.04-arm'
          || matrix.platform == 'macOS ARM64' && 'macos-15'
          || 'windows-2025' }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform: >-
          ${{ fromJSON((!inputs.platform || inputs.platform == 'all')
              && '["Linux ARM64", "macOS ARM64", "Windows x64"]'
              || format('["{0}"]', inputs.platform)) }}
    env:
      RUSTUP_TOOLCHAIN: '1.97.1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      ARGENTIC_REQUIRE_NATIVE_READER: '1'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -Vv

      - name: Check Rust formatting and Clippy
        if: runner.os == 'Linux' && inputs.suite != 'reader'
        run: |
          rustup component add rustfmt clippy
          for crate in argentic-harness argentic-core argentic-runtime; do
            (
              cd "crates/$crate"
              cargo fmt --all --check
              cargo clippy --locked --all-targets -- -D warnings
            )
          done
          cd crates/argentic-runtime
          cargo clippy --locked --all-targets --features agsdl-engine-qa -- -D warnings
          cargo clippy --locked --all-targets --features dev-support -- -D warnings

      - name: Check the macOS ARM64 runner
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          swiftc --version

      - name: TEMP diagnose launch requirement enforcement
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set -x
          sw_vers
          csrutil status || true
          csrutil authenticated-root status || true
          nvram boot-args || true
          sysctl kern.bootargs || true
          sysctl security.mac.amfi 2>/dev/null || true
          d="$(mktemp -d)"
          cp /usr/bin/true "$d/adhoc-true"
          codesign -s - -f "$d/adhoc-true"
          codesign -dv /usr/bin/true "$d/adhoc-true" 2>&1 | grep -E 'CDHash=|Signature|flags' || true
          cat > "$d/probe.swift" <<'EOF'
          import Foundation
          import LightweightCodeRequirements
          import Security
          func cdhash(_ path: String) -> Data {
              var code: SecStaticCode?
              precondition(SecStaticCodeCreateWithPath(URL(fileURLWithPath: path) as CFURL, [], &code) == errSecSuccess)
              var info: CFDictionary?
              precondition(SecCodeCopySigningInformation(code!, SecCSFlags(rawValue: kSecCSSigningInformation), &info) == errSecSuccess)
              return (info as! [String: Any])[kSecCodeInfoUnique as String] as! Data
          }
          func probe(_ label: String, _ path: String, _ hash: Data) {
              let process = Process()
              process.executableURL = URL(fileURLWithPath: path)
              do {
                  process.launchRequirement = try LaunchCodeRequirement.allOf { CodeDirectoryHash(hash) }
                  try process.run()
                  process.waitUntilExit()
                  print("PROBE \(label): ran, status \(process.terminationStatus), reason \(process.terminationReason.rawValue)")
              } catch {
                  print("PROBE \(label): refused: \(error)")
              }
          }
          let adhoc = CommandLine.arguments[1]
          probe("true with own cdhash", "/usr/bin/true", cdhash("/usr/bin/true"))
          probe("true with false cdhash", "/usr/bin/true", cdhash("/usr/bin/false"))
          probe("adhoc with own cdhash", adhoc, cdhash(adhoc))
          probe("adhoc with true cdhash", adhoc, cdhash("/usr/bin/true"))
          let selfPath = CommandLine.arguments[2]
          probe("adhoc with probe cdhash", adhoc, cdhash(selfPath))
          EOF
          swiftc -target arm64-apple-macosx14.4 -o "$d/probe" "$d/probe.swift"
          "$d/probe" "$d/adhoc-true" "$d/probe"
          rustup component add clippy
          (cd crates/argentic-runtime && cargo clippy --locked --all-targets --features agsdl-content-qa -- -D warnings && cargo clippy --locked --all-targets -- -D warnings)

      - name: Install Bubblewrap and enable unprivileged user namespaces
        if: runner.os == 'Linux' && inputs.suite != 'reader'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap curl
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "ARGENTIC_REQUIRE_BWRAP=1" >> "$GITHUB_ENV"

      - name: Test argentic-harness
        if: inputs.suite != 'reader'
        working-directory: crates/argentic-harness
        run: cargo test --locked --all-targets

      - name: Measure Argentic staging and turn latency
        if: runner.os == 'Linux' && inputs.suite != 'reader'
        working-directory: crates/argentic-harness
        run: |
          cargo test --locked --lib shell_staging -- --ignored --nocapture
          cargo test --locked --test engine scripted_turn_overhead -- --ignored --nocapture

      - name: Test argentic-core
        if: inputs.suite != 'reader'
        working-directory: crates/argentic-core
        run: |
          cargo test --locked --all-targets -- --test-threads=1
          cargo test --locked --doc

      - name: Test native content reader
        if: inputs.suite == 'reader'
        working-directory: crates/argentic-runtime
        run: cargo test --locked --test content_reader

      - name: Test macOS debug content reader
        if: runner.os == 'macOS'
        working-directory: crates/argentic-runtime
        run: cargo test --locked --features agsdl-content-qa --test content_reader

      - name: Test argentic-runtime
        if: inputs.suite != 'reader'
        working-directory: crates/argentic-runtime
        run: |
          cargo_args=(--locked --all-targets)
          test_args=(--test-threads=1)
          if [[ "$RUNNER_OS" == Linux ]]; then
            cargo_args+=(--features agsdl-engine-qa)
          fi
          if [[ "$RUNNER_OS" != Windows ]]; then
            # The no-Bun test already runs all 37 scenarios in both storage modes.
            test_args+=(--skip agsdl030_conformance_all_37_scenarios)
          fi
          cargo test "${cargo_args[@]}" -- "${test_args[@]}"
          cargo test --locked --doc

      - name: Measure idle Argentic instance memory
        if: runner.os == 'Linux' && inputs.suite != 'reader'
        working-directory: crates/argentic-runtime
        run: cargo test --locked --features agsdl-engine-qa --lib idle_history_round_trips_provider_replay -- --nocapture

      - name: Build standalone host
        if: inputs.suite != 'reader'
        working-directory: crates/argentic-runtime
        run: cargo build --locked --example argentic-host

      - name: Test approval boundary
        if: inputs.suite != 'reader'
        working-directory: crates/argentic-runtime
        run: cargo test --locked --features dev-support --test approval_boundary -- --test-threads=1
