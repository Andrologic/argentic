[package]
name = "argentic-runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Owned AgSDL execution with embedded SQLite"

[features]
editor-parity = []
dev-support = []
agsdl-engine-qa = []
agsdl-content-qa = []

[dependencies]
axum = "0.8"
tempfile = "3"
argentic-harness = { version = "0.1.0", path = "../argentic-harness" }
argentic-core = { version = "0.1.0", path = "../argentic-core" }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
schemars = "0.8"
jsonschema = { version = "0.46", default-features = false, features = ["arbitrary-precision"] }
regex = "1"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures = "0.3"
async-trait = "0.1"
semver = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
thiserror = "2"
url = "2"
# Maintained successor of the deprecated serde_yaml, kept under its old name.
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
# Scan skill front matter with the same tokenizer before deserializing it.
libyaml-rs = "0.3"
unicode-normalization = "0.1"
tracing = "0.1"
portable-pty = "0.8"
cap-std = "=4.0.3"
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
crc32fast = "1"
flate2 = "1"
percent-encoding = "2"
unicase = "2"
unicode-general-category = "1"

# Shared in-memory pools wait for SQLite table locks via unlock notifications.
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "sqlite-unlock-notify"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemInformation", "Wdk_System_SystemServices"] }

[build-dependencies]
serde_json = "1"

[[test]]
name = "approval_boundary"
required-features = ["dev-support"]

[[test]]
name = "content_reader"
harness = false

[workspace]
resolver = "2"
