[package]
name = "argentic-harness"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "In-process agent harness for AgSDL"

[dependencies]
async-trait = "0.1"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
futures = "0.3"
httpdate = "1"
idna = "1"
jsonschema = { version = "0.46", default-features = false, features = ["arbitrary-precision"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
tempfile = "3"
thiserror = "2"
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(all(target_os = "linux", any(target_arch = "aarch64", target_arch = "x86_64")), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
base64 = "0.22"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = "0.14"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["net", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["net", "rt-multi-thread", "test-util"] }

[workspace]
resolver = "2"
