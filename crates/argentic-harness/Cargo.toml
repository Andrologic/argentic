[package]
name = "argentic-harness"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "In-process agent harness for AgSDL"

[dependencies]
async-trait = "0.1"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
futures = "0.3"
httpdate = "1"
jsonschema = { version = "0.46", default-features = false, features = ["arbitrary-precision"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["net", "rt-multi-thread", "test-util"] }

[workspace]
resolver = "2"
